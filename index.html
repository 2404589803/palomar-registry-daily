<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Palomar Registry Daily</title><style>body{font:16px system-ui;max-width:1100px;margin:2rem auto;padding:0 1rem;color:#17202a}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ddd;margin-bottom:1rem}input{padding:.65rem;width:100%;max-width:500px;margin:1rem 0}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:.7rem;border-bottom:1px solid #eee;vertical-align:top}a{color:#135bd8}.meta{color:#667085}</style></head><body><header><h1>Palomar Registry Daily</h1><span id="meta" class="meta">加载中…</span></header><p>每日同步 Lean-verified mathematics 登记结果。</p><input id="q" placeholder="搜索标题、作者或分类…"><table><thead><tr><th>结果</th><th>作者</th><th>分类</th><th>版本/日期</th></tr></thead><tbody id="rows"></tbody></table><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data=[];
fetch('data/latest.json').then(r=>r.json()).then(x=>{data=x.results.entries||[];document.querySelector('#meta').textContent=`更新于 ${new Date(x.fetched_at).toLocaleString()} · ${data.length} 条`;render()}).catch(()=>document.querySelector('#meta').textContent='数据加载失败');
function render(){let q=document.querySelector('#q').value.toLowerCase();document.querySelector('#rows').innerHTML=data.filter(e=>JSON.stringify(e).toLowerCase().includes(q)).map(e=>`<tr><td><a href="${esc(e.url||e.link||'#')}">${esc(e.title||e.name||e.id)}</a><br><span class="meta">${esc(e.id||'')}</span></td><td>${esc((e.authors||[]).join(', ')||e.author)}</td><td>${esc((e.arxiv||[]).join(', '))}<br>${esc((e.msc||[]).join(', '))}</td><td>${esc(e.version||'')}<br>${esc(e.registered||e.date||'')}</td></tr>`).join('')||'<tr><td colspan="4">没有匹配结果</td></tr>'}document.querySelector('#q').addEventListener('input',render);
</script></body></html>
